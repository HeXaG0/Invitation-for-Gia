<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe4e1 50%, #ffd4e5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating hearts background */
        .heart-bg {
            position: fixed;
            top: -10%;
            left: 0;
            width: 100%;
            height: 120%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            opacity: 0.3;
            animation: float-up 15s infinite;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        #container {
            background: white;
            padding: 3rem 2.5rem;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(210, 18, 46, 0.2);
            max-width: 450px;
            z-index: 1;
            animation: slideIn 0.6s ease-out;
            position: relative;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            color: #d2122e;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .gif-container {
            margin: 1.5rem 0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .gif-container img {
            width: 100%;
            max-width: 300px;
            display: block;
            border-radius: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #yesBtn {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: white;
            animation: gentle-bounce 2s ease-in-out infinite;
        }

        @keyframes gentle-bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        #yesBtn:hover {
            transform: scale(1.15);
            box-shadow: 0 6px 25px rgba(76, 175, 80, 0.4);
        }

        #noBtn {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
            position: relative;
        }

        #noBtn:hover {
            transform: scale(0.95);
        }

        /* Success state */
        .success-state {
            animation: celebrate 0.6s ease-out;
        }

        @keyframes celebrate {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            z-index: 999;
            pointer-events: none;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .message-extra {
            margin-top: 1rem;
            color: #666;
            font-size: 1rem;
            font-style: italic;
        }

        /* No button click counter */
        .denial-counter {
            margin-top: 1rem;
            color: #d2122e;
            font-size: 0.9rem;
            min-height: 20px;
        }

        /* Responsive */
        @media (max-width: 500px) {
            #container {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }

            h1 {
                font-size: 1.6rem;
            }

            button {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="heart-bg" id="heartBg"></div>

    <div id="container">
        <div class="gif-container">
            <img id="mainGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpndmZ4bmZ1Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/qUIm5wu6LAAog/giphy.gif" alt="Puppy Eyes">
        </div>
        <h1 id="questionText">Will you be my Valentine? ❤️</h1>
        <p class="message-extra" id="extraMessage"></p>
        <p class="denial-counter" id="denialCounter"></p>
        
        <div class="buttons" id="buttonGroup">
            <button id="yesBtn" onclick="celebrate()">Yes! 💕</button>
            <button id="noBtn" onmouseover="handleNoHover()" onclick="handleNoClick()">No</button>
        </div>
    </div>

    <script>
        let noHoverCount = 0;
        let yesBtnSize = 1;
        const messages = [
            "Are you sure? 🥺",
            "Really? But we'd be perfect together! 💕",
            "Please reconsider? 🙏",
            "I'll be sad... 😢",
            "Last chance! ❤️",
            "The Yes button is getting bigger... 👀",
            "You can't resist forever! 😊",
            "Just click Yes already! 💝"
        ];

        // Create floating hearts background
        function createFloatingHearts() {
            const heartBg = document.getElementById('heartBg');
            const hearts = ['❤️', '💕', '💖', '💗', '💝', '💘'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 15 + 's';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heartBg.appendChild(heart);
            }
        }

        function handleNoHover() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            // Move the No button to random position
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 100);
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
            noBtn.style.zIndex = '10';

            // Increase Yes button size
            noHoverCount++;
            if (noHoverCount <= 8) {
                yesBtnSize += 0.15;
                yesBtn.style.transform = `scale(${yesBtnSize})`;
                
                // Update message
                document.getElementById('extraMessage').textContent = messages[Math.min(noHoverCount - 1, messages.length - 1)];
            }
        }

        function handleNoClick() {
            // If they somehow click it, still make it move
            handleNoHover();
        }

        function celebrate() {
            const mainGif = document.getElementById('mainGif');
            const questionText = document.getElementById('questionText');
            const buttonGroup = document.getElementById('buttonGroup');
            const container = document.getElementById('container');
            const extraMessage = document.getElementById('extraMessage');
            const denialCounter = document.getElementById('denialCounter');

            // Update content
            mainGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMmw0Nnd4bmZ1Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/TdfyKrN7HGTIY/giphy.gif"; 
            questionText.innerHTML = "See you love 🥰";
            extraMessage.textContent = "Yieee nag yes na sa wakas💖";
            denialCounter.textContent = "";
            
            // Hide buttons
            buttonGroup.style.display = 'none';

            // Add success animation
            container.classList.add('success-state');

            // Change background
            document.body.style.background = 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffecd2 100%)';

            // Create confetti
            createConfetti();

            // Add more floating hearts
            for (let i = 0; i < 20; i++) {
                setTimeout(() => createFloatingHearts(), i * 100);
            }
        }

        function createConfetti() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#00d2d3'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animation = `confetti-fall ${Math.random() * 3 + 2}s linear`;
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }

        // Initialize floating hearts on load
        createFloatingHearts();

        // Track hover attempts
        let hoverAttempts = 0;
        document.getElementById('noBtn').addEventListener('mouseover', () => {
            hoverAttempts++;
            if (hoverAttempts >= 3) {
                document.getElementById('denialCounter').textContent = `You've tried to say no ${hoverAttempts} times... just give in! 😄`;
            }
        });
    </script>
</body>
</html>
